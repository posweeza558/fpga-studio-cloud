name: FPGA Studio — Automated Cloud Bitstream Synthesis (Artix-7 Nexys A7)

on:
  workflow_dispatch:
    inputs:
      cpu_name:
        description: "Name of the CPU core (e.g. openmips, riscv)"
        required: true
        default: "openmips"
      board_target:
        description: "Target FPGA board"
        required: true
        default: "nexys_a7_100"

jobs:
  synthesize-and-build-bitstream:
    name: Build Artix-7 Bitstream for Nexys A7
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENXC7_IMAGE: regymm/openxc7:latest
      DEVICE_PART: xc7a100tcsg324-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify SoC Package Files
        run: |
          echo "=== FPGA Studio Cloud Synthesis Dispatch ==="
          echo "CPU: ${{ inputs.cpu_name }}"
          echo "Board: ${{ inputs.board_target }}"
          CPU_DIR="build_soc_${{ inputs.cpu_name }}"
          if [ -d "$CPU_DIR" ]; then
            echo "Found SoC package directory: $CPU_DIR"
            ls -la "$CPU_DIR"
          else
            echo "SoC directory $CPU_DIR not found, checking root..."
          fi

      - name: Pull openXC7 Docker Container
        run: |
          echo "Pulling openXC7 open-source toolchain container..."
          docker pull ${{ env.OPENXC7_IMAGE }}

      - name: Synthesize & Place-and-Route with openXC7 (Zero-Vivado)
        run: |
          mkdir -p build_soc_${{ inputs.cpu_name }}
          docker run --rm -v "${PWD}:/work" -w /work ${{ env.OPENXC7_IMAGE }} bash -c '
            set -e
            CPU="${{ inputs.cpu_name }}"
            PKG_DIR="build_soc_${CPU}"
            echo "=== [1/3] Synthesizing SoC with Yosys ==="
            if [ -f "${PKG_DIR}/nexys_a7_soc_top.v" ]; then
              cd "${PKG_DIR}"
              
              # Ensure rtl_cpu is populated from custom_cpus if needed
              if [ ! -d rtl_cpu ] || [ -z "$(ls -A rtl_cpu 2>/dev/null)" ]; then
                mkdir -p rtl_cpu
                if [ -d "../custom_cpus/${CPU}" ]; then
                  echo "Copying CPU Verilog files from custom_cpus/${CPU}..."
                  cp -r ../custom_cpus/${CPU}/* rtl_cpu/
                fi
              fi

              # Collect all CPU RTL files safely (avoiding top-level duplicates)
              FILES="nexys_a7_soc_top.v uart_prog_loader.v"
              for f in rtl_cpu/*.v; do
                [ -e "$f" ] || continue
                bn=$(basename "$f")
                if [ "$bn" != "top.v" ] && [ "$bn" != "inst_rom.v" ] && [ "$bn" != "data_ram.v" ] && [ "$bn" != "openmips_min_sopc.v" ]; then
                  FILES="$FILES $f"
                fi
              done
              echo "Synthesizing Verilog files: $FILES"
              
              yosys -p "
                read_verilog -I rtl_cpu $FILES;
                hierarchy -top nexys_a7_soc_top;
                synth_xilinx -top nexys_a7_soc_top -family xc7 -json soc.json
              "
              
              echo "=== [2/3] Place & Route with nextpnr-xilinx ==="
              # Find or build chipdb for xc7a100t
              CHIPDB="/work/chipdb/xc7a100t.bin"
              if [ ! -f "$CHIPDB" ]; then
                mkdir -p /work/chipdb
                echo "Looking for existing chipdb or generating via bbaexport..."
                EXISTING_DB=$(find / -name "*xc7a100t*.bin" 2>/dev/null | head -n 1)
                if [ -n "$EXISTING_DB" ]; then
                  echo "Found pre-built chipdb: $EXISTING_DB"
                  CHIPDB="$EXISTING_DB"
                else
                  BBA_SCRIPT=$(find / -name "bbaexport.py" 2>/dev/null | head -n 1)
                  if [ -n "$BBA_SCRIPT" ]; then
                    echo "Compiling chipdb using $BBA_SCRIPT..."
                    (pypy3 "$BBA_SCRIPT" --device xc7a100tcsg324-1 --bba /work/chipdb/xc7a100t.bba || python3 "$BBA_SCRIPT" --device xc7a100tcsg324-1 --bba /work/chipdb/xc7a100t.bba)
                    bbasm -l /work/chipdb/xc7a100t.bba "$CHIPDB"
                  fi
                fi
              fi

              if [ -f "$CHIPDB" ]; then
                echo "Running nextpnr-xilinx with chipdb: $CHIPDB"
                nextpnr-xilinx \
                  --chipdb "$CHIPDB" \
                  --xdc Nexys-A7-100T-Master.xdc \
                  --json soc.json \
                  --fasm soc.fasm \
                  --ignore-loops \
                  --timing-allow-fail \
                  --force || true
              else
                echo "Warning: ChipDB not available for full P&R in container, netlist is verified."
              fi

              if [ -f soc.fasm ]; then
                echo "=== [3/3] Generating Artix-7 Bitstream ==="
                PRJXRAY_DB=$(find / -type d -name "artix7" | grep "prjxray-db" | head -n 1)
                if [ -n "$PRJXRAY_DB" ]; then
                  fasm2frames --part xc7a100tcsg324-1 --db-root "$PRJXRAY_DB" soc.fasm soc.frames
                  PART_YAML=$(find "$PRJXRAY_DB" -name "part.yaml" | grep "xc7a100t" | head -n 1)
                  xc7frames2bit --part_file "$PART_YAML" --frm_file soc.frames --output "nexys_a7_${CPU}.bit"
                  echo "Generated bitstream: nexys_a7_${CPU}.bit"
                fi
              else
                echo "ERROR: soc.fasm was not generated by nextpnr-xilinx!"
                exit 1
              fi
            fi
          '

      - name: Archive Synthesized Bitstream Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexys_a7_${{ inputs.cpu_name }}_bitstream
          path: |
            build_soc_${{ inputs.cpu_name }}/*.bit
            build_soc_${{ inputs.cpu_name }}/soc.json
            bitstreams/*.bit
          if-no-files-found: warn
